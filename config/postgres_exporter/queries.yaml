pg_stat_top_queries:
  query: |
    SELECT
      queryid::text AS queryid,
      LEFT(query, 200) AS query,
      calls,
      total_exec_time / 1000.0 AS total_exec_time_seconds,
      mean_exec_time / 1000.0 AS mean_exec_time_seconds,
      stddev_exec_time / 1000.0 AS stddev_exec_time_seconds
    FROM pg_stat_statements
    WHERE calls > 5
    ORDER BY total_exec_time DESC
    LIMIT 100
  metrics:
    - queryid:
        usage: LABEL
        description: Unique query identifier
    - query:
        usage: LABEL
        description: Query text (truncated to 200 chars)
    - calls:
        usage: GAUGE
        description: Total number of times this query has been executed
    - total_exec_time_seconds:
        usage: GAUGE
        description: Total time spent executing this query, in seconds
    - mean_exec_time_seconds:
        usage: GAUGE
        description: Mean execution time for this query, in seconds
    - stddev_exec_time_seconds:
        usage: GAUGE
        description: Standard deviation of execution time, in seconds
