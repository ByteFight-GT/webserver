spring.application.name=BotFightWebServer
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

supabase.project-url=${SUPABASE_PROJECT_URL}
supabase.jwks-uri=${SUPABASE_JWKS_URI}
supabase.issuer=${SUPABASE_ISSUER}
supabase.service-role=${SUPABASE_SERVICE_ROLE}
supabase.connect-timeout-ms=3000
supabase.read-timeout-ms=5000

storage.root=./storage
storage.hmac-secret=${STORAGE_HMAC_SECRET}

matchmaking.enabled=${MATCHMAKING_ENABLED}
matchmaking.cron=0 0 */2 * * *
matchmaking.tz=America/New_York

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

logging.file.name=logs/application.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

spring.cloud.gcp.credentials.encoded=${GOOGLE_CREDENTIALS_JSON_ENCODED}
spring.cloud.gcp.credentials.location=${GOOGLE_APPLICATION_CREDENTIALS}
spring.cloud.gcp.credentials.project=${GOOGLE_PROJECT_ID}
ADMINS_PATH=${ADMINS_PATH}
spring.rabbitmq.uri=${RABBIT_HOST}
GCP_BUCKET=${GCP_BUCKET}
ADMINS=${ADMINS}
CHALLONGE_API_KEY=${CHALLONGE_API_KEY}
is-prod-env: ${IS_PROD_ENV:false}

hibernate.search.default.directory_provider = filesystem
hibernate.search.default.indexBase = ./data/index/default

server.forward-headers-strategy=framework