spring.application.name=BotFightWebServer
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

server.error.include-stacktrace=never

supabase.project-url=${SUPABASE_PROJECT_URL}
supabase.jwks-uri=${SUPABASE_JWKS_URI}
supabase.issuer=${SUPABASE_ISSUER}
supabase.service-role=${SUPABASE_SERVICE_ROLE}
supabase.connect-timeout-ms=3000
supabase.read-timeout-ms=5000

storage.root=./storage
storage.hmac-secret=${STORAGE_HMAC_SECRET}

matchmaking.enabled=${MATCHMAKING_ENABLED}
matchmaking.cron=0 */30 * * * *
matchmaking.tz=America/New_York

backup.db-dump-dir=./db_backups

gamematch.requeue-stale=true
gamematch.stale-threshold-minutes=240

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

logging.file.name=logs/application.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

ADMINS_PATH=${ADMINS_PATH}
spring.rabbitmq.uri=${RABBIT_HOST}
GCP_BUCKET=${GCP_BUCKET}
ADMINS=${ADMINS}
CHALLONGE_API_KEY=${CHALLONGE_API_KEY}
is-prod-env: ${IS_PROD_ENV:false}

hibernate.search.default.directory_provider = filesystem
hibernate.search.default.indexBase = ./data/index/default

server.forward-headers-strategy=framework
