name: bytefight-server
services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  spring:
    build:
      context: ./
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "${HOST_PORT}:8080"
    volumes:
      - storage:/app/storage
    environment:
      SPRING_PROFILES_ACTIVE: prod

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    depends_on:
      - postgres
    entrypoint: cloudflared
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - "${CLOUDFLARE_TOKEN}"
    env_file:
      - .env

volumes:
  db_data:
    driver: local
  storage:
    driver: local