name: Staging CI + Deploy

on:
  push:
    branches: [ staging ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Copy env file
        run: cp /srv/staging/backend/.env .env

      - name: Deploy
        env:
          COMPOSE_PROJECT_NAME: bytefight-staging
        run: |
          set -euo pipefail
          docker compose up -d --build --remove-orphans
