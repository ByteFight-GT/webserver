name: Staging CI + Deploy

on:
  workflow_dispatch:
  push:
    branches: [ staging ]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    environment: staging

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Copy env file
        run: cp /srv/staging/backend/.env .env

      - name: Deploy
        env:
          COMPOSE_PROJECT_NAME: bytefight-staging-webserver
        run: |
          set -euo pipefail
          docker compose pull
          docker compose up -d --build --remove-orphans

      - name: Remove env file from workspace
        if: always()
        run: rm -f .env
